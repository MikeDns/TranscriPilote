name: Signaler un bug
description: Quelque chose ne fonctionne pas comme prévu
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler un problème.
        **Ne joignez jamais d'enregistrement ou de transcription confidentiels.**
  - type: input
    id: version
    attributes:
      label: Version de TranscriPilote
      description: Réglages → Version et mises à jour
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Partie concernée
      options:
        - Installation / premier lancement
        - Enregistrement
        - Transcription
        - Identification des locuteurs
        - Résumés
        - Discussion
        - Historique / export
        - Sauvegarde cloud
        - Mises à jour
        - Autre
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Que s'est-il passé ?
      description: Et qu'attendiez-vous à la place ?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Aller dans l'onglet ...
        2. Cliquer sur ...
        3. Le message ... s'affiche
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environnement
      description: Version de Windows, RAM, modèle Whisper et modèle Ollama utilisés
      placeholder: "Windows 11, 16 Go, Whisper small, mistral"
  - type: textarea
    id: logs
    attributes:
      label: Message d'erreur
      description: Copiez le texte exact affiché, si possible
      render: text
